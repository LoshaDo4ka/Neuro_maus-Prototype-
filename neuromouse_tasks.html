<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroMouse — Таск-менеджер</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: inherit;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .stage-header {
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .stage-header:hover { background: var(--accent); }

    .task-row {
      transition: background 0.12s, opacity 0.2s;
    }
    .task-row:hover { background: color-mix(in srgb, var(--accent) 60%, transparent); }

    .task-row.done td { opacity: 0.45; }
    .task-row.done .task-label { text-decoration: line-through; }

    .custom-cb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }
    .custom-cb:checked {
      background: var(--primary);
      border-color: var(--primary);
    }
    .custom-cb:checked::after {
      content: '';
      position: absolute;
      left: 3px; top: 0px;
      width: 5px; height: 9px;
      border: 2px solid var(--primary-foreground);
      border-top: none; border-left: none;
      transform: rotate(45deg);
    }

    .progress-bar-inner {
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
      border-radius: 9999px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .collapsible-body {
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      max-height: 9999px;
      opacity: 1;
    }
    .collapsible-body.collapsed {
      max-height: 0;
      opacity: 0;
    }

    .chevron {
      transition: transform 0.25s;
    }
    .chevron.open { transform: rotate(180deg); }

    .risk-badge-high { background: color-mix(in srgb, #ef4444 20%, transparent); color: #ef4444; }
    .risk-badge-med  { background: color-mix(in srgb, #f59e0b 20%, transparent); color: #d97706; }
    .risk-badge-resolved { background: color-mix(in srgb, #10b981 20%, transparent); color: #10b981; }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
    }

    .filter-btn {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      background: transparent;
      color: var(--muted-foreground);
    }
    .filter-btn.active {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: var(--primary);
    }

    .tooltip-wrap { position: relative; }
    .tooltip-box {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--foreground);
      white-space: nowrap;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      pointer-events: none;
    }
    .tooltip-wrap:hover .tooltip-box { display: block; }
  </style>
</head>
<body>

<div class="max-w-5xl mx-auto px-4 py-8">

  <!-- HEADER -->
  <div class="flex flex-col gap-1 mb-6">
    <div class="flex items-center gap-3 flex-wrap">
      <span class="text-3xl">🧠</span>
      <h1 class="text-2xl font-bold text-[var(--foreground)]">NeuroMouse</h1>
      <span class="badge" style="background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary);">Исследовательский проект</span>
    </div>
    <p class="text-[var(--muted-foreground)] text-sm">Двусторонний нейроинтерфейс «мозг мыши ↔ ИИ» · Никита Кукса · <code class="text-xs bg-[var(--accent)] px-1.5 py-0.5 rounded">F:\NeuroMouse</code></p>
  </div>

  <!-- STATS ROW -->
  <div class="grid grid-cols-2 gap-3 mb-4" id="statsGrid">
    <div class="stat-card">
      <div class="text-xs text-[var(--muted-foreground)] mb-1">Общий прогресс</div>
      <div class="flex items-end gap-2">
        <span class="text-2xl font-bold text-[var(--foreground)]" id="pctText">0%</span>
        <span class="text-xs text-[var(--muted-foreground)] mb-0.5" id="countText">0 / 0</span>
      </div>
      <div class="h-2 rounded-full mt-2" style="background:var(--accent)">
        <div id="globalBar" class="progress-bar-inner h-2" style="width:0%;background:var(--primary)"></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="text-xs text-[var(--muted-foreground)] mb-1">Текущий этап</div>
      <div class="text-base font-semibold text-[var(--foreground)]" id="currentStage">—</div>
      <div class="text-xs text-[var(--muted-foreground)] mt-1" id="currentStageDesc">—</div>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="flex flex-wrap gap-2 mb-5" id="filterBar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">Все этапы</button>
    <button class="filter-btn" data-filter="active" onclick="setFilter('active', this)">Активные</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done', this)">Выполненные</button>
  </div>

  <!-- STAGES -->
  <div id="stagesContainer" class="flex flex-col gap-4"></div>

  <!-- RISKS -->
  <div class="mt-6 border border-[var(--border)] rounded-xl overflow-hidden">
    <div class="px-4 py-3 flex items-center gap-2" style="background:color-mix(in srgb,#ef4444 10%,transparent)">
      <span>⚠️</span>
      <span class="font-semibold text-sm text-[var(--foreground)]">Открытые риски и вопросы</span>
    </div>
    <div id="risksContainer" class="divide-y divide-[var(--border)]"></div>
  </div>

  <!-- FOOTER -->
  <div class="mt-6 text-xs text-[var(--muted-foreground)] text-center">
    Прогресс сохраняется в браузере · Последнее обновление: <span id="lastUpdate">—</span>
  </div>

</div>

            desc: 'Kilosort в режиме "drift correction" или онлайн-версия. Задержка spike sorting: типично 1–10 мс для уже обученной модели.' },
          { id: 's8_3', label: 'Развернуть декодер с задержкой < 20 мс', done: false,
            desc: 'Для замкнутого контура критична задержка. 20 мс — типичная цель для нейронных интерфейсов. Требует оптимизации конвейера обработки.' },
        ]
      },
      {
        name: 'Нисходящий канал (AI → brain)',
        tasks: [
          { id: 's8_4', label: 'Разработать протокол обратного воздействия (совместно с лабораторией)', done: false,
            desc: 'Оптогенетика, электрическая микростимуляция или другой метод. Каждый имеет свои требования к оборудованию, безопасности и биоэтике.' },
          { id: 's8_5', label: 'Верифицировать техническую безопасность и контролируемость воздействия', done: false,
            desc: 'Перед экспериментом на животных: убедиться что параметры стимуляции (ток, длительность, частота) точно контролируются и не превышают безопасных пределов.' },
          { id: 's8_6', label: 'Провести пилотный эксперимент с замкнутым контуром', done: false,
            desc: 'Первый полный цикл: регистрация → декодирование → стимуляция → измерение ответа. Документировать всё детально.' },
          { id: 's8_7', label: 'Верифицировать эффект воздействия независимыми измерениями', done: false,
            desc: 'Доказать причинно-следственную связь: стимуляция в момент T вызвала изменение X, а не просто совпала с ним. Контрольные условия обязательны.' },

const RISKS = [
  { level: 'resolved', icon: '✅', title: 'S001R01.edf — аннотации и условия проверены',
    desc: 'Проверено 25.10.2026 через MNE: файл содержит ровно 1 событие T0 длительностью 60.2 с (покой, глаза открыты). Классификатор движений по нему строить нельзя — для Этапа III нужны запуски R03/R04.' },
  { level: 'resolved', icon: '✅', title: 'Воспроизводимость подтверждена (SHA-256 проверен)',
    desc: 'Скрипт перезапущен 25.10.2026 после переноса в src/eeg_pipeline.py: все 1856 строк признаков и SHA-256 хэши CSV-файлов совпали бит-в-бит.' },
  { level: 'resolved', icon: '✅', title: 'Git-репозиторий настроен + .gitignore',
    desc: 'Репозиторий инициализирован, первый коммит сделан (c066b4c). .gitignore исключает Miniforge/, крупные данные (*.nwb, *.fif, *.npy, *.zip) и *.exe. Рабочие скрипты сведены в единый пакет src/.' },
  { level: 'resolved', icon: '✅', title: 'sessions_registry.json создан',
    desc: 'ВЫПОЛНЕНО 26.10.2026. В корне проекта создан реестр сессий с двумя записями: 719161530 (Allen, probe 729445654) и Richards_2017-10-31 (Steinmetz). Метаданные (subject, probe, электроды, структуры мозга, испытания) извлечены из NWB-файлов через pynwb.' },
  { level: 'resolved', icon: '✅', title: 'Этап I закрыт: все проверки пройдены',
    desc: 'ВЫПОЛНЕНО 26.10.2026. Скрипт src/stage1_verification.py проверяет задачи 1.5, 1.8, 1.9, 1.10, 1.15 и 1.16; результат — all_checks_passed: true в results/stage1/verification_results.json. Найден нулевой участок 60.2–61.0 с в конце файла (забивка вне разметки T0), на анализ не влияет.' },
];

// =============================================
// STATE
// =============================================
let doneSet = new Set();
let currentFilter = 'all';

function loadState() {
  try {
    const saved = localStorage.getItem('neuromouse_tasks');
    if (saved) doneSet = new Set(JSON.parse(saved));
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('neuromouse_tasks', JSON.stringify([...doneSet]));
  localStorage.setItem('neuromouse_updated', new Date().toLocaleString('ru-RU'));
}

// =============================================
// RENDER
// =============================================
function renderStages() {
  const container = document.getElementById('stagesContainer');
  container.innerHTML = '';

  STAGES.forEach(stage => {
    const allTasks = stage.groups.flatMap(g => g.tasks);
    const doneCount = allTasks.filter(t => doneSet.has(t.id) || t.done).length;
    const total = allTasks.length;
    const pct = total ? Math.round(doneCount / total * 100) : 0;

    if (currentFilter === 'done' && doneCount === 0) return;
    if (currentFilter === 'active' && doneCount === total && total > 0) return;

    const el = document.createElement('div');
    el.className = 'border border-[var(--border)] rounded-xl overflow-hidden';
    el.innerHTML = `
      <div class="stage-header px-4 py-3 flex items-center gap-3" onclick="toggleStage('${stage.id}')">
        <span class="text-xl">${stage.icon}</span>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-semibold text-sm text-[var(--foreground)]">${stage.title}</span>
            <span class="badge" style="background:${stage.badgeColor}22;color:${stage.badgeColor}">${stage.badge}</span>
          </div>
          <div class="flex items-center gap-3 mt-1">
            <span class="text-xs text-[var(--muted-foreground)]">⏱ ${stage.period}</span>
            <span class="text-xs text-[var(--muted-foreground)]">💶 ${stage.budget}</span>
            <span class="text-xs text-[var(--muted-foreground)]">${doneCount}/${total} задач</span>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <div class="w-16 h-1.5 rounded-full" style="background:var(--accent)">
            <div class="progress-bar-inner h-1.5" style="width:${pct}%;background:${stage.badgeColor}"></div>
          </div>
          <span class="text-xs font-mono text-[var(--muted-foreground)] w-8 text-right">${pct}%</span>
          <svg class="chevron open w-4 h-4 text-[var(--muted-foreground)]" id="chev-${stage.id}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>

      <div class="collapsible-body" id="body-${stage.id}">
        <div class="px-4 pb-3">
          <p class="text-xs text-[var(--muted-foreground)] border-l-2 border-[var(--border)] pl-3 py-1 mb-3">${stage.goal}</p>
          ${renderGroups(stage)}
        </div>
      </div>
    `;
    container.appendChild(el);
  });
}

function renderGroups(stage) {
  return stage.groups.map(group => `
    <div class="mb-3">
      <div class="text-xs font-semibold text-[var(--muted-foreground)] uppercase tracking-wider mb-1 px-1">${group.name}</div>
      <table class="w-full border-collapse">
        <tbody>
          ${group.tasks.map(task => renderTask(task)).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}

function renderTask(task) {
  const isDone = doneSet.has(task.id) || task.done;
  return `
    <tr class="task-row ${isDone ? 'done' : ''}" id="row-${task.id}">
      <td class="py-1.5 pr-2 w-6 align-top pt-2">
        <input type="checkbox" class="custom-cb" ${isDone ? 'checked' : ''}
          onchange="toggleTask('${task.id}', this)" />
      </td>
      <td class="py-1.5 align-top">
        <div class="task-label text-sm text-[var(--foreground)] leading-snug">${task.label}</div>
        <div class="text-xs text-[var(--muted-foreground)] mt-0.5 leading-relaxed">${task.desc}</div>
      </td>
    </tr>
  `;
}

function renderRisks() {
  const container = document.getElementById('risksContainer');
  container.innerHTML = RISKS.map(r => `
    <div class="px-4 py-3 flex gap-3">
      <span class="text-base flex-shrink-0 mt-0.5">${r.icon}</span>
      <div>
        <div class="text-sm font-medium text-[var(--foreground)] mb-0.5">
          <span class="badge mr-2 ${r.level === 'high' ? 'risk-badge-high' : r.level === 'resolved' ? 'risk-badge-resolved' : 'risk-badge-med'}">${r.level === 'high' ? 'Высокий' : r.level === 'resolved' ? 'Решено' : 'Средний'}</span>
          ${r.title}
        </div>
        <div class="text-xs text-[var(--muted-foreground)] leading-relaxed">${r.desc}</div>
      </div>
    </div>
  `).join('');
}

// =============================================
// LOGIC
// =============================================
function toggleTask(id, cb) {
  const row = document.getElementById('row-' + id);
  if (cb.checked) {
    doneSet.add(id);
    row.classList.add('done');
  } else {
    doneSet.delete(id);
    row.classList.remove('done');
  }
  saveState();
  updateStats();
}

function toggleStage(id) {
  const body = document.getElementById('body-' + id);
  const chev = document.getElementById('chev-' + id);
  body.classList.toggle('collapsed');
  chev.classList.toggle('open');
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderStages();
  updateStats();
}

function updateStats() {
  const allTasks = STAGES.flatMap(s => s.groups.flatMap(g => g.tasks));
  const total = allTasks.length;
  const done = allTasks.filter(t => doneSet.has(t.id) || t.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;

  document.getElementById('pctText').textContent = pct + '%';
  document.getElementById('countText').textContent = `${done} / ${total} задач`;
  document.getElementById('globalBar').style.width = pct + '%';

  // Current stage
  let cur = null;
  for (const s of STAGES) {
    const tasks = s.groups.flatMap(g => g.tasks);
    const stageDone = tasks.filter(t => doneSet.has(t.id) || t.done).length;
    if (stageDone < tasks.length) { cur = s; break; }
  }
  if (cur) {
    document.getElementById('currentStage').textContent = cur.title;
    document.getElementById('currentStageDesc').textContent = `${cur.period} · ${cur.budget}`;
  } else {
    document.getElementById('currentStage').textContent = '🎉 Все этапы выполнены!';
    document.getElementById('currentStageDesc').textContent = '';
  }

  const upd = localStorage.getItem('neuromouse_updated') || '—';
  document.getElementById('lastUpdate').textContent = upd;
}

// =============================================
// INIT
// =============================================
loadState();
renderStages();
renderRisks();
updateStats();
</script>
</body>
</html>
